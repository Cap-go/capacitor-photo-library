appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness-retained.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-low-memory-mid-library
    direction: DOWN
    timeout: 45000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: e2e-flow-low-memory-mid-library
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(?:EVENT:RUN|RUN):low-memory-mid-library.*'
    timeout: 60000
- extendedWaitUntil:
    visible: '.*PHASE:low-memory-mid-library:fetching.*'
    timeout: 90000