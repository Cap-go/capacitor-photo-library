appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: low-memory-mid-library
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: low-memory-mid-library
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*RUN:low-memory-mid-library.*'
    timeout: 45000
- extendedWaitUntil:
    visible: '.*PHASE:low-memory-mid-library:fetching.*'
    timeout: 90000