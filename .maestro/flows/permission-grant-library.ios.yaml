appId: app.capgo.photo.library
---
- runFlow:
    file: ../helpers/launch-harness-ios-auto-unset.yaml
    env:
      MAESTRO_FLOW_ID: permission-grant-library
- extendedWaitUntil:
    visible: '.*RUN:permission-grant-library.*'
    timeout: 60000
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'Allow access to all photos'
    optional: true
- tapOn:
    text: 'Allow Full Access'
    optional: true
- tapOn:
    text: 'Allow Access to All Photos'
    optional: true
- extendedWaitUntil:
    visible: '.*Marker: permission-grant-library:success.*'
    timeout: 120000