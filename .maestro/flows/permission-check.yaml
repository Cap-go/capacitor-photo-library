appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness-unprivileged.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-permission-check
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-permission-check
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: permission-check:success.*'
    timeout: 120000