appId: app.capgo.photo.library
---
- runFlow:
    file: ../helpers/launch-harness-unprivileged.yaml
    when:
      platform: Android
- runFlow:
    file: ../helpers/launch-harness-ios-grant.yaml
    when:
      platform: iOS
- scrollUntilVisible:
    element:
      text: permission-check
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: permission-check
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: permission-check:success.*'
    timeout: 120000
