appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      capgoMaestroFlow: permission-check
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- tapOn:
    text: permission-check
    optional: true
- extendedWaitUntil:
    visible: '.*EVENT:RUN:permission-check.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Marker: permission-check:success.*'
    timeout: 120000