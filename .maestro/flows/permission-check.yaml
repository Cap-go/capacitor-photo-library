appId: app.capgo.photo.library
---
- runFlow:
    file: ../helpers/launch-harness-unprivileged.yaml
    when:
      platform: android
- runFlow:
    file: ../helpers/launch-harness-ios-grant.yaml
    when:
      platform: ios
- scrollUntilVisible:
    element:
      text: permission-check
    direction: DOWN
    timeout: 45000
    centerElement: true
    when:
      platform: ios
- scrollUntilVisible:
    element:
      id: e2e-flow-permission-check
    direction: DOWN
    timeout: 45000
    centerElement: true
    when:
      platform: android
- tapOn:
    text: permission-check
    retryTapIfNoChange: true
    when:
      platform: ios
- tapOn:
    id: e2e-flow-permission-check
    retryTapIfNoChange: true
    when:
      platform: android
- extendedWaitUntil:
    visible: '.*Marker: permission-check:success.*'
    timeout: 120000