appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness-ios-grant.yaml
- scrollUntilVisible:
    element:
      text: permission-check
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: permission-check
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(?:EVENT:RUN|RUN):permission-check.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Marker: permission-check:success.*'
    timeout: 120000