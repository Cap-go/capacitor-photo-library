appId: app.capgo.photo.library
---
- runFlow:
    file: ../helpers/launch-harness-ios-auto-unset.yaml
    env:
      MAESTRO_FLOW_ID: permission-check
- extendedWaitUntil:
    visible: '.*RUN:permission-check.*'
    timeout: 60000
- extendedWaitUntil:
    visible: '.*Marker: permission-check:success.*'
    timeout: 120000