appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      capgoMaestroFlow: permission-check
    permissions:
      photos: unset
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*RUN:permission-check.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Marker: permission-check:success.*'
    timeout: 120000