appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: pick-media-cancel
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: pick-media-cancel
- extendedWaitUntil:
    visible: '.*EVENT:RUN:pick-media-cancel.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: Cancel
    optional: true
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 180000