appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      - isE2E=pick-media-cancel
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*RUN:pick-media-cancel.*'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: Cancel
    optional: true
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 180000