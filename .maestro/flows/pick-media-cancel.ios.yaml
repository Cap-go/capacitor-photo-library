appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness-retained.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-pick-media-cancel
    direction: DOWN
    timeout: 45000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: e2e-flow-pick-media-cancel
    retryTapIfNoChange: true
- tapOn:
    id: e2e-flow-pick-media-cancel
    retryTapIfNoChange: true
    optional: true
- extendedWaitUntil:
    visible: '.*(?:EVENT:RUN|RUN):pick-media-cancel.*'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: Cancel
    optional: true
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 180000