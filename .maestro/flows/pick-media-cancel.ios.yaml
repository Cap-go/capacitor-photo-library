appId: app.capgo.photo.library
---
- runFlow:
    file: ../helpers/launch-harness-ios-auto.yaml
    env:
      MAESTRO_FLOW_ID: pick-media-cancel
- extendedWaitUntil:
    visible: '.*RUN:pick-media-cancel.*'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: Cancel
    optional: true
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 180000