appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      capgoMaestroFlow: permission-grant-library
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*EVENT:RUN:permission-grant-library.*'
    timeout: 90000
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'Allow access to all photos'
    optional: true
- tapOn:
    text: 'Allow Full Access'
    optional: true
- tapOn:
    text: 'Allow Access to All Photos'
    optional: true
- extendedWaitUntil:
    visible: '.*Marker: permission-grant-library:success.*'
    timeout: 120000
