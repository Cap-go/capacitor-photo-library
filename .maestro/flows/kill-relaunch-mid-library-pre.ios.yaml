appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness-retained.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-kill-relaunch-mid-library
    direction: DOWN
    timeout: 45000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: e2e-flow-kill-relaunch-mid-library
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(?:EVENT:RUN|RUN):kill-relaunch-mid-library.*'
    timeout: 60000
- extendedWaitUntil:
    visible: '.*PHASE:kill-relaunch-mid-library:fetching.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*STATE:kill-relaunch-mid-library:fetched:.*'
    timeout: 120000
    optional: true