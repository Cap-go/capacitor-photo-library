appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      capgoMaestroFlow: pick-media-cancel
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*PHASE:pick-media-cancel:opening.*'
    timeout: 120000