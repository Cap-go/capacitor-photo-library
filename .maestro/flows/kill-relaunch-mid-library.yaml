appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-kill-relaunch-mid-library
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-kill-relaunch-mid-library
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*EVENT:RUN:kill-relaunch-mid-library.*'
    timeout: 45000
- extendedWaitUntil:
    visible: '.*PHASE:kill-relaunch-mid-library:fetching.*'
    timeout: 45000
- stopApp
- launchApp:
    clearState: false
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Marker: kill-relaunch-mid-library:success.*'
    timeout: 120000