appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      capgoMaestroFlow: kill-relaunch-mid-library
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
- tapOn:
    text: kill-relaunch-mid-library
    optional: true
    timeout: 90000
- extendedWaitUntil:
    visible: '.*PHASE:kill-relaunch-mid-library:fetching.*'
    timeout: 90000
- stopApp
- launchApp:
    clearState: false
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
- tapOn:
    text: kill-relaunch-mid-library
    optional: true
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Marker: kill-relaunch-mid-library:success.*'
    timeout: 120000
