appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      capgoMaestroFlow: low-memory-mid-library
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- tapOn:
    text: low-memory-mid-library
    optional: true
- extendedWaitUntil:
    visible: '.*PHASE:low-memory-mid-library:fetching.*'
    timeout: 90000