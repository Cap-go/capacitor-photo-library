appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: false
    arguments:
      isE2E: true
      capgoMaestroFlow: permission-denied
    permissions:
      all: deny
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*RUN:permission-denied.*'
    timeout: 60000
- extendedWaitUntil:
    visible: '.*Marker: permission-denied:success.*'
    timeout: 120000
