appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness-retained.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-permission-denied
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-permission-denied
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*EVENT:RUN:permission-denied.*'
    timeout: 45000
- extendedWaitUntil:
    visible: '.*Marker: permission-denied:success.*'
    timeout: 90000