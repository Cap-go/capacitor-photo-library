appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-pick-media-cancel
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-pick-media-cancel
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*PHASE:pick-media-cancel:opening.*'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- pressKey: Back
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 180000