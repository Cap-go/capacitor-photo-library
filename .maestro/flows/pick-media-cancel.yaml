appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: pick-media-cancel
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: pick-media-cancel
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*PHASE:pick-media-cancel:opening.*'
    timeout: 90000
- tapOn:
    text: Cancel
    optional: true
- tapOn:
    text: 'CANCEL'
    optional: true
- tapOn:
    text: Close
    optional: true
- pressKey: Back
- extendedWaitUntil:
    visible: '.*Harness: ready.*|.*PHASE:pick-media-cancel:opening.*'
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 180000