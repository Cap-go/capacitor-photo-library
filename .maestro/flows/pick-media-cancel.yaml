appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-pick-media-cancel
    direction: DOWN
    timeout: 45000
    centerElement: true
    optional: true
- scrollUntilVisible:
    element:
      text: pick-media-cancel
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-pick-media-cancel
    optional: true
- tapOn:
    text: pick-media-cancel
    retryTapIfNoChange: true
- tapOn:
    id: e2e-flow-pick-media-cancel
    optional: true
- tapOn:
    text: Cancel
    optional: true
- pressKey: Back
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 180000
