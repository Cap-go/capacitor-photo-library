appId: app.capgo.photo.library
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      capgoMaestroFlow: pick-media-cancel
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*EVENT:RUN:pick-media-cancel.*'
    timeout: 120000
- tapOn:
    text: Cancel
    optional: true
- tapOn:
    text: Close
    optional: true
- tapOn:
    text: 'Navigate up'
    optional: true
- pressKey: Back
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 120000