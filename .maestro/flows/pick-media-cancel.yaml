appId: app.capgo.photo.library
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-pick-media-cancel
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-pick-media-cancel
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*EVENT:RUN:pick-media-cancel.*'
    timeout: 45000
- extendedWaitUntil:
    visible: '.*PHASE:pick-media-cancel:opening.*'
    timeout: 45000
- tapOn:
    text: Cancel
    optional: true
- tapOn:
    text: Close
    optional: true
- tapOn:
    text: 'Navigate up'
    optional: true
- pressKey: Back
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: '.*Marker: pick-media-cancel:success.*'
    timeout: 120000