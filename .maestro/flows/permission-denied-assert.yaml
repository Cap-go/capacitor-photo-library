appId: app.capgo.photo.library
---
- launchApp:
    clearState: false
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: e2e-flow-permission-denied
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-permission-denied
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*EVENT:RUN:permission-denied.*'
    timeout: 45000
- extendedWaitUntil:
    visible: '.*Marker: permission-denied:success.*'
    timeout: 90000