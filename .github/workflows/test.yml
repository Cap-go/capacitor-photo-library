name: Build source code and test it

concurrency:
  group: build-source-code-and-test-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [ main ]
  workflow_call:  # Allow this workflow to be called by other workflows

env:
  BUN_VERSION: 1.4.2
  MAESTRO_VERSION: cli-2.4.0

jobs:
  guard_swiftpm_version:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in Package.swift"
            exit 1
          fi
      - name: Check Maestro flow manifest matches CI
        run: bash scripts/maestro/assert-flow-manifest.sh
  build_android:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Build
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh android
  build_ios:
    runs-on: macOS-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh ios
  web:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    name: 'Build code and test'
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Lint
        id: lint_code
        run: bun run lint
      - name: Verify packed package in example app (Web)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh web
      - name: Verify
        id: verify_code
        run: bun run verify:web

  maestro_build_android_app:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Maestro Android app
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Build Android Maestro example app
        run: bun scripts/maestro/prepare-maestro-app.mjs android
      - name: Upload Android Maestro app
        uses: actions/upload-artifact@v4
        with:
          name: maestro-photo-library-android-app
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  maestro_build_ios_app:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build Maestro iOS app
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Cache iOS DerivedData for Maestro app
        uses: actions/cache@v4
        with:
          path: .maestro-ios-derived-data
          key: maestro-ios-derived-${{ runner.os }}-${{ hashFiles('example-app/ios/**', 'ios/**', 'example-app/bun.lock', 'Package.swift') }}
      - name: Build iOS Maestro example app
        env:
          CAPGO_MAESTRO_IOS_DERIVED_DATA: ${{ github.workspace }}/.maestro-ios-derived-data
        run: bun scripts/maestro/prepare-maestro-app.mjs ios
      - name: Upload iOS Maestro app
        uses: actions/upload-artifact@v4
        with:
          name: maestro-photo-library-ios-app
          path: .maestro-ios-derived-data/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

  maestro_e2e_android:
    permissions:
      contents: read
    needs:
      - maestro_build_android_app
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Maestro E2E Android / ${{ matrix.flow }}
    strategy:
      fail-fast: false
      matrix:
        flow:
          - permission-check
          - permission-grant-library
          - permission-denied
          - pick-media-cancel
          - kill-relaunch-mid-library
          - low-memory-mid-library
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download Android Maestro app
        uses: actions/download-artifact@v4
        with:
          name: maestro-photo-library-android-app
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run Maestro flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_FLOW=${{ matrix.flow }}
            CAPGO_MAESTRO_TIMEOUT_SECONDS=360
            CAPGO_MAESTRO_TEST_RETRIES=2
            MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
            ./scripts/test-maestro-photo-library-android.sh
      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-android-${{ matrix.flow }}
          path: maestro-results

  maestro_e2e_ios:
    permissions:
      contents: read
    needs:
      - maestro_build_ios_app
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Maestro E2E iOS / ${{ matrix.flow }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        flow:
          - permission-check
          - permission-grant-library
          - permission-denied
          - pick-media-cancel
          - kill-relaunch-mid-library
          - low-memory-mid-library
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download iOS Maestro app
        uses: actions/download-artifact@v4
        with:
          name: maestro-photo-library-ios-app
          path: maestro-ios-app
      - name: Normalize downloaded iOS app bundle
        run: |
          if [[ ! -d maestro-ios-app/App.app ]] && [[ -f maestro-ios-app/Info.plist ]]; then
            bundle_dir="$(mktemp -d)"
            mv maestro-ios-app "$bundle_dir/App.app"
            mkdir -p maestro-ios-app
            mv "$bundle_dir/App.app" maestro-ios-app/
            rmdir "$bundle_dir"
          fi
          if [[ ! -d maestro-ios-app/App.app ]]; then
            echo "Expected App.app under maestro-ios-app after download" >&2
            ls -laR maestro-ios-app | head -80 >&2
            exit 1
          fi
      - name: Run Maestro flow
        env:
          CAPGO_MAESTRO_IOS_APP_PATH: maestro-ios-app/App.app
          CAPGO_MAESTRO_FLOW: ${{ matrix.flow }}
          CAPGO_MAESTRO_TIMEOUT_SECONDS: 360
          CAPGO_MAESTRO_TEST_RETRIES: 2
          CAPGO_MAESTRO_LIGHT_RETRY_SLEEP_SECONDS: 2
          CAPGO_MAESTRO_SKIP_IOS_ANIMATIONS: 1
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: bash ./scripts/test-maestro-photo-library-ios.sh
      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-ios-${{ matrix.flow }}
          path: maestro-results-ios

  maestro_e2e_ios_gate:
    if: always()
    needs:
      - maestro_e2e_ios
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Maestro E2E iOS
    permissions:
      actions: read
    steps:
      - name: Fail when any iOS Maestro shard fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '[.jobs[] | select(.name | contains("Maestro E2E iOS / ")) | .conclusion]')
          echo "$conclusions"
          count=$(echo "$conclusions" | jq 'length')
          success=$(echo "$conclusions" | jq '[.[] | select(. == "success")] | length')
          if [[ "$count" -ne 6 ]]; then
            echo "Expected 6 iOS Maestro flow jobs, found ${count}."
            exit 1
          fi
          if [[ "$success" -ne 6 ]]; then
            echo "One or more iOS Maestro flows did not succeed (${success}/6 success)."
            exit 1
          fi

  maestro_e2e_android_gate:
    if: always()
    needs:
      - maestro_e2e_android
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Maestro E2E Android
    permissions:
      actions: read
    steps:
      - name: Fail when any Android Maestro flow fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '[.jobs[] | select(.name | contains("Maestro E2E Android / ")) | .conclusion]')
          echo "$conclusions"
          count=$(echo "$conclusions" | jq 'length')
          success=$(echo "$conclusions" | jq '[.[] | select(. == "success")] | length')
          if [[ "$count" -ne 6 ]]; then
            echo "Expected 6 Android Maestro flow jobs, found ${count}."
            exit 1
          fi
          if [[ "$success" -ne 6 ]]; then
            echo "One or more Android Maestro flows did not succeed (${success}/6 success)."
            exit 1
          fi

